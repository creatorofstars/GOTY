<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intro — The Last Star</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: 'Nunito', sans-serif; }
  .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  .sound {
    position: fixed; left: clamp(16px, 3vw, 42px); top: clamp(16px, 3vw, 42px); z-index: 3;
    display: none; align-items: center; gap: 8px;
    font-family: 'Baloo 2', 'Trebuchet MS', sans-serif; font-weight: 700; font-size: 1rem;
    color: #ffe9a8; background: rgba(20, 26, 55, .72);
    border: 1.5px solid rgba(255, 220, 130, .45); border-radius: 12px;
    padding: 10px 20px; cursor: pointer; letter-spacing: .03em;
    transition: background .18s ease, transform .18s ease;
  }
  .sound:hover { background: rgba(45, 55, 110, .85); transform: translateY(-2px); }
  .skip {
    position: fixed; right: clamp(16px, 3vw, 42px); bottom: clamp(16px, 3vw, 42px); z-index: 3;
    font-family: 'Baloo 2', 'Trebuchet MS', sans-serif; font-weight: 700; font-size: 1rem;
    color: #ffe9a8; background: rgba(20, 26, 55, .72);
    border: 1.5px solid rgba(255, 220, 130, .45); border-radius: 12px;
    padding: 10px 22px; cursor: pointer; letter-spacing: .03em;
    transition: background .18s ease, transform .18s ease;
  }
  .skip:hover { background: rgba(45, 55, 110, .85); transform: translateY(-2px); }
</style>
</head>
<body>
  <div class="stage">
    <video id="intro" src="/opening-video/very%20final%20opening%20game%20intro%20-%20compressed%20x2.mp4" preload="auto" playsinline></video>
  </div>

  <button class="sound" id="soundBtn" type="button">🔇 Tap for sound</button>
  <button class="skip" id="skipBtn" type="button">Skip intro ›</button>

<script>
  const GAME_URL = '/game';
  const v = document.getElementById('intro');
  const soundBtn = document.getElementById('soundBtn');

  let done = false;
  function goToGame() {
    if (done) return;
    done = true;
    window.location.href = GAME_URL;
  }

  v.addEventListener('ended', goToGame);
  v.addEventListener('error', goToGame); // broken video → never trap the player
  document.getElementById('skipBtn').addEventListener('click', goToGame);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') goToGame(); });

  // browsers block sound-autoplay on a fresh load — start muted in that case
  // and offer a one-tap unmute; otherwise the intro plays straight away with sound
  v.play().then(() => {
    if (v.muted) soundBtn.style.display = 'inline-flex';
  }).catch(() => {
    v.muted = true;
    soundBtn.style.display = 'inline-flex';
    v.play().catch(goToGame); // can't play at all → go straight to the game
  });

  soundBtn.addEventListener('click', () => {
    v.muted = false;
    v.volume = 1;
    soundBtn.style.display = 'none';
    const p = v.play();
    if (p && p.catch) p.catch(() => {});
  });
</script>
</body>
</html>
