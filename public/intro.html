<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intro — The Last Star</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: 'Nunito', sans-serif; }
  .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  .start {
    position: fixed; inset: 0; z-index: 2;
    display: flex; flex-direction: column; gap: 20px;
    align-items: center; justify-content: center; background: #000;
  }
  .start.hidden { display: none; }
  .btn-start {
    font-family: 'Baloo 2', 'Trebuchet MS', sans-serif;
    font-weight: 800; font-size: clamp(1.3rem, 2.5vw, 2rem);
    color: #6b3d07; letter-spacing: .01em;
    background: linear-gradient(180deg, #fff3c4, #f9c941 46%, #e8a41f);
    border: 2px solid #a86f16; border-radius: 16px;
    padding: .7em 2.2em .78em; cursor: pointer;
    box-shadow: 0 6px 0 #9c6410, 0 14px 30px rgba(0, 0, 0, .5), inset 0 2px 0 rgba(255, 255, 255, .75);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .btn-start:hover { transform: translateY(-3px); box-shadow: 0 9px 0 #9c6410, 0 18px 34px rgba(0, 0, 0, .55); }
  .btn-start:active { transform: translateY(1px); box-shadow: 0 3px 0 #9c6410; }
  .hint { color: #8f9bc4; font-size: .9rem; }
  .skip {
    position: fixed; right: clamp(16px, 3vw, 42px); bottom: clamp(16px, 3vw, 42px); z-index: 3;
    font-family: 'Baloo 2', 'Trebuchet MS', sans-serif; font-weight: 700; font-size: 1rem;
    color: #ffe9a8; background: rgba(20, 26, 55, .72);
    border: 1.5px solid rgba(255, 220, 130, .45); border-radius: 12px;
    padding: 10px 22px; cursor: pointer; letter-spacing: .03em;
    transition: background .18s ease, transform .18s ease;
  }
  .skip:hover { background: rgba(45, 55, 110, .85); transform: translateY(-2px); }
</style>
</head>
<body>
  <div class="stage">
    <video id="intro" src="/opening-video/very%20final%20opening%20game%20intro%20-%20compressed%20x2.mp4" preload="auto" playsinline></video>
  </div>

  <div class="start" id="startScreen">
    <button class="btn-start" id="startBtn" type="button">▶ Start Intro</button>
    <p class="hint">the game loads as soon as it ends</p>
  </div>

  <button class="skip" id="skipBtn" type="button">Skip intro ›</button>

<script>
  const GAME_URL = '/game';
  const v = document.getElementById('intro');
  const startScreen = document.getElementById('startScreen');

  let done = false;
  function goToGame() {
    if (done) return;
    done = true;
    window.location.href = GAME_URL;
  }

  function begin() {
    startScreen.classList.add('hidden');
    try { v.currentTime = 0; } catch (e) { /* ignore */ }
    const p = v.play();
    if (p && p.catch) p.catch(() => { v.controls = true; });
  }

  v.addEventListener('ended', goToGame);
  v.addEventListener('error', goToGame); // broken video → never trap the player
  document.getElementById('startBtn').addEventListener('click', begin);
  document.getElementById('skipBtn').addEventListener('click', goToGame);
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !startScreen.classList.contains('hidden')) begin();
    if (e.key === 'Escape') goToGame();
  });

  // returning players may get sound-autoplay allowed — skip the start screen then
  const p = v.play();
  if (p && p.then) p.then(() => startScreen.classList.add('hidden')).catch(() => {});
</script>
</body>
</html>
